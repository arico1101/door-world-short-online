<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トビラ せかい版 オンライン ショート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --page:#F2F9FD; --card:#FFFFFF; --ink:#3F5266; --sub:#8A97A5; --line:#E3EDF4;
  --pink:#F4879F; --gold:#FBD96B; --btn:#5B7FA8; --btn-d:#43617F;
  --money:#D9A32B; --learn:#4E8FC0; --happy:#E4708F;
  --ok:#86D9A5; --lock:#FFC98C; --unseen:#B7A6EA;
  --sh:0 4px 16px rgba(63,82,102,.10);
  --sh-s:0 2px 8px rgba(63,82,102,.10);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
  background:var(--page); color:var(--ink); line-height:1.8;
  font-variant-numeric:tabular-nums;
}
button{font-family:inherit; cursor:pointer; border:none;}
.screen{display:none; min-height:100vh;}
.screen.active{display:block;}
.ic{width:1.05em; height:1.05em; vertical-align:-.16em; flex:none;}
.ic.s{width:.92em; height:.92em;}

/* ---------- ロビー・待機 ---------- */
#lobby,#wait{display:none; place-items:center; padding:26px 18px;}
#lobby.active,#wait.active{display:grid;}
.setup-card{width:min(520px,100%); margin:0 auto; text-align:center;}
.title-door{width:104px; height:128px; margin:0 auto 14px; position:relative;
  background:var(--pink); border-radius:52px 52px 10px 10px; display:grid; place-items:center;
  box-shadow:0 6px 0 rgba(214,104,130,.4);}
.title-door .leaf{width:82px; height:106px; border-radius:41px 41px 7px 7px; background:#FBD96B;
  position:relative; transition:transform .6s cubic-bezier(.2,.8,.3,1.2); transform-origin:left center;}
.title-door:hover .leaf{transform:perspective(400px) rotateY(-36deg);}
.title-door .knob{position:absolute; right:12px; top:56px; width:11px; height:11px;
  border-radius:50%; background:var(--btn);}
h1.game-title{font-size:clamp(32px,8vw,48px); font-weight:900; letter-spacing:.1em;}
.game-sub{font-size:14px; font-weight:700; color:var(--sub); margin:6px 0 24px;}
.player-inputs{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
.p-row{display:flex; align-items:center; gap:10px; background:var(--card); border-radius:16px;
  padding:9px 14px; box-shadow:var(--sh-s);}
.p-dot{width:20px; height:20px; border-radius:50%; flex:none;}
.p-row input{flex:1; border:none; outline:none; font-family:inherit; font-size:16px;
  font-weight:700; color:var(--ink); background:transparent; min-width:0;}
.p-row .rm{background:transparent; font-size:17px; color:var(--happy); font-weight:900; padding:2px 6px;}
.row-btns{display:flex; gap:10px; justify-content:center; margin-bottom:18px;}
.chip-btn{background:var(--card); border-radius:999px; padding:8px 18px; font-weight:700;
  font-size:13.5px; color:var(--ink); box-shadow:var(--sh-s);}
.chip-btn.on{background:var(--gold); color:#7A6320;}
.fac-toggle{display:flex; align-items:flex-start; gap:9px; text-align:left; background:var(--card);
  border-radius:16px; padding:12px 15px; font-size:12.5px; font-weight:700; line-height:1.7;
  margin:0 auto 20px; width:min(440px,100%); cursor:pointer; box-shadow:var(--sh-s);}
.fac-toggle input{width:18px; height:18px; margin-top:3px; accent-color:var(--pink); flex:none;}
.fac-toggle small{color:var(--sub);}
.big-btn{display:inline-block; background:var(--pink); color:#fff; font-size:18px; font-weight:900;
  padding:15px 42px; border-radius:999px; letter-spacing:.08em; box-shadow:0 5px 0 #D66882;
  transition:transform .08s;}
.big-btn:active{transform:translateY(3px); box-shadow:0 2px 0 #D66882;}
.setup-note{margin-top:16px; font-size:12.5px; line-height:1.85; color:var(--sub); font-weight:700;}
.room-code{font-size:clamp(30px,9vw,46px); font-weight:900; letter-spacing:.3em;
  color:var(--ink); background:var(--card); border-radius:18px; padding:12px 8px 12px 22px;
  margin:6px auto 14px; width:min(400px,100%); box-shadow:var(--sh);}
.wait-row{justify-content:space-between;}
.wait-row .st{font-size:12px; font-weight:700; color:var(--sub);}

/* ---------- ゲーム画面 ---------- */
#game{padding:0 0 108px;}
.sticky-head{position:sticky; top:0; z-index:40; background:var(--page);
  padding:10px 12px 8px; box-shadow:0 8px 12px -10px rgba(63,82,102,.3);}
.topbar{display:flex; align-items:center; gap:9px; max-width:1180px; margin:0 auto 9px;}
.topbar .logo{font-weight:900; font-size:17px; letter-spacing:.08em; color:var(--pink); flex:none;}
.turn-pill{flex:1; min-width:0; display:flex; align-items:center; gap:9px; background:#FFF1F5;
  border-radius:999px; padding:6px 14px; font-weight:900; font-size:clamp(13px,2.4vw,15px);
  overflow:hidden;}
.turn-pill .av{width:28px; height:28px; border-radius:50%; flex:none; border:2px solid var(--pink);
  background-color:#fff; background-size:cover; background-position:center 16%;}
.turn-pill .tp-txt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.turn-pill .tp-off{flex:none; font-size:.76em; color:var(--happy);}
.help-btn{width:36px; height:36px; border-radius:50%; background:var(--card); display:grid;
  place-items:center; color:var(--btn); box-shadow:var(--sh-s); flex:none;}
.help-btn.card-btn{width:auto; padding:0 13px; display:inline-flex; gap:5px;}
.card-btn .cb-lbl{font-size:12.5px; font-weight:900; color:var(--ink);}
.players-strip{display:flex; gap:8px; overflow-x:auto; max-width:1180px; margin:0 auto;
  padding:2px 2px 6px;}
.pcard{flex:1 0 156px; background:var(--card); border-radius:15px; padding:8px 11px;
  box-shadow:var(--sh-s); display:flex; gap:9px; align-items:center; opacity:.72; transition:opacity .2s;}
.pcard.now{opacity:1; box-shadow:0 0 0 2.5px var(--pink), var(--sh-s);}
.pcard.done{opacity:.45;} .pcard.off{opacity:.35;} .pcard.left{opacity:.3; filter:grayscale(1);}
.pcard .av{width:38px; height:38px; border-radius:50%; flex:none; border:2.5px solid var(--line);
  background-color:#F7FBFD; background-size:cover; background-position:center 16%;}
.pcard .nm{font-size:12.5px; font-weight:900; line-height:1.35; display:flex; align-items:center; gap:5px;}
.pcard .age{font-size:10.5px; font-weight:700; color:var(--sub);}
.pcard .row{display:flex; gap:8px; font-size:11px; font-weight:900; margin-top:1px;}
.m1{color:var(--money);} .m2{color:var(--learn);} .m3{color:var(--happy);}
.mine-badge{font-size:10px; font-weight:900; color:#fff; background:var(--pink);
  border-radius:999px; padding:0 7px;}
.board-wrap{max-width:1180px; margin:10px auto 0; padding:0 12px;}
#board{display:block; width:100%; height:auto; border-radius:18px;}
.controls{position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex; justify-content:center; z-index:50; pointer-events:none;
  background:linear-gradient(transparent,rgba(242,249,253,.9) 40%);}
.dice-btn{pointer-events:auto; background:var(--btn); color:#fff; font-size:17px; font-weight:900;
  letter-spacing:.06em; padding:14px 40px; border-radius:999px; box-shadow:0 5px 0 var(--btn-d);
  display:flex; align-items:center; gap:11px; transition:transform .08s;}
.dice-btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--btn-d);}
.dice-btn:disabled{opacity:.5; cursor:default;}
.dice-face{background:#fff; border-radius:11px; width:38px; height:38px; display:grid;
  grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:6px; gap:1px;}
.dice-face span{display:grid; place-items:center;}
.dice-face i{width:6px; height:6px; border-radius:50%; background:var(--pink);}
.dice-face.spin{animation:diceSpin .4s linear infinite;}
@keyframes diceSpin{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.12)}}

/* ---------- モーダル ---------- */
.overlay{position:fixed; inset:0; background:rgba(63,82,102,.42); z-index:100;
  display:none; place-items:center; padding:16px;}
.overlay.open{display:grid;}
.modal{width:min(420px,100%); max-height:88vh; overflow-y:auto; background:var(--card);
  border-radius:24px; box-shadow:0 12px 36px rgba(63,82,102,.28);
  animation:pop .26s cubic-bezier(.2,.8,.3,1.2);}
.modal.wide{width:min(620px,100%);}
@keyframes pop{from{transform:scale(.88); opacity:0} to{transform:scale(1); opacity:1}}
.m-head{padding:18px 20px 15px; text-align:center;}
.m-tag{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:900;
  letter-spacing:.1em; padding:4px 13px; border-radius:999px; color:#fff;}
.modal h2{font-size:clamp(19px,4.4vw,23px); font-weight:900; margin-top:9px; line-height:1.45;}
.m-sub{font-size:12px; font-weight:700; color:var(--sub);}
.m-body{padding:4px 20px 20px;}
.m-lead{font-size:13px; font-weight:700; color:#54677A; text-align:center; line-height:1.85;
  margin-bottom:14px;}
.m-note{background:#F7FBFD; border-radius:14px; padding:11px 14px; font-size:12.5px;
  font-weight:700; line-height:1.8; margin-bottom:13px;}
.m-note.priv{background:#FBF4FB;}
.m-btn{display:block; width:100%; background:var(--btn); color:#fff; font-size:15px; font-weight:900;
  padding:13px; border-radius:999px; margin-top:6px; box-shadow:0 4px 0 var(--btn-d); transition:transform .08s;}
.m-btn:active{transform:translateY(2px); box-shadow:0 2px 0 var(--btn-d);}
.m-btn.ghost{background:var(--card); color:var(--ink); box-shadow:var(--sh-s);}
.fx-line{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:12px 0 14px;}
.fx{background:#F7FBFD; border-radius:999px; padding:4px 14px; font-weight:900; font-size:14px;
  display:inline-flex; align-items:center; gap:4px;}
.big-amount{text-align:center; font-size:28px; font-weight:900; margin:10px 0 14px;}

/* 選択肢 */
.door-list{display:flex; flex-direction:column; gap:9px;}
.door{display:block; width:100%; text-align:left; border-radius:16px; padding:12px 15px;
  transition:transform .08s; background:#F7FBFD;}
.door:not(:disabled):active{transform:translateY(2px);}
.door .d-title{display:block; font-size:15px; font-weight:900; line-height:1.45;}
.door .d-desc{display:block; font-size:11.5px; font-weight:700; color:#6E7E8C; margin-top:3px; line-height:1.65;}
.door .d-key{display:flex; font-size:11.5px; font-weight:900; margin-top:7px;
  align-items:center; gap:4px; flex-wrap:wrap;}
.door.open{background:#FDF3D9;} .door.open .d-key{color:#A9801F;}
.door.locked{background:#FBEDED; cursor:not-allowed;} .door.locked .d-key{color:#C25B5B;}
.door.unseen{background:repeating-linear-gradient(45deg,#F1F3F5,#F1F3F5 9px,#EAEEF1 9px,#EAEEF1 18px);
  cursor:not-allowed;}
.door.unseen .d-title{color:#9AA7B2; letter-spacing:.16em;}
.door.unseen .d-desc{color:#AEB9C2;}
.d-cost{font-size:11.5px; font-weight:900; margin-top:4px; display:block;}
.d-cost.minus{color:#C25B5B;} .d-cost.plus{color:#4FA85E;}
.d-cost s{opacity:.55; margin-right:3px; font-weight:700;}

/* 観戦 */
.modal.watching{background:#F8FAFC;}
.watch-head{display:flex; align-items:center; justify-content:center; gap:8px; background:var(--btn);
  color:#fff; border-radius:999px; padding:7px 16px; font-size:12.5px; font-weight:900; margin:0 20px 14px;}
.watch-head .av{width:24px; height:24px; border-radius:50%; border:2px solid #fff; flex:none;
  background-color:#fff; background-size:cover; background-position:center 16%;}
.watch-body{text-align:center; padding:0 20px 18px;}
.watch-lead{font-size:13px; font-weight:700; color:var(--sub); line-height:1.85;}
.watch-door{display:inline-block; background:#FFF1F5; border-radius:18px; padding:14px 24px;
  margin:12px 0 8px; font-size:19px; font-weight:900;}
.watch-wait{font-size:13px; font-weight:900; color:var(--sub); margin:6px 0 10px;}
.waiting-note{text-align:center; font-weight:700; color:var(--sub); margin-top:10px; font-size:13px;}

/* ステータス変化 */
.chg{border-radius:22px; overflow:hidden;}
.chg-head{background:var(--gold); text-align:center; padding:12px;}
.chg-head span{font-size:17px; font-weight:900; letter-spacing:.12em; color:#7A6320;}
.chg-body{display:flex; gap:13px; align-items:center; padding:16px 18px 6px;}
.chg-char{width:74px; height:98px; flex:none; background-size:contain;
  background-repeat:no-repeat; background-position:center bottom;}
.chg-rows{flex:1; min-width:0; display:flex; flex-direction:column; gap:7px;}
.chg-r{display:grid; grid-template-columns:58px 1fr auto; align-items:center; gap:8px;
  border-radius:12px; padding:8px 12px;}
.chg-r.money{background:#FFF4DC;} .chg-r.money .k{color:#B98A2A;}
.chg-r.learn{background:#E7F2FC;} .chg-r.learn .k{color:#3F7EAC;}
.chg-r.happy{background:#FDECF2;} .chg-r.happy .k{color:#CE6288;}
.chg-r .k{font-size:11px; font-weight:900;}
.chg-r .v{font-size:14.5px; font-weight:900; display:flex; align-items:center; gap:3px;}
.chg-r .v s{color:#B4C1CB; font-weight:700; margin-right:3px; display:inline-flex; align-items:center; gap:2px;}
.chg-r .d{font-size:13.5px; font-weight:900;}
.up{color:#4FA85E;} .dn{color:#D9737B;}

/* 家庭カード */
.fam-top{padding:16px 18px 14px; display:flex; gap:13px; align-items:center;}
.fam-top .av{width:60px; height:60px; border-radius:50%; flex:none; border:3px solid #fff;
  background-color:#fff; background-size:cover; background-position:center 16%;
  box-shadow:0 2px 8px rgba(63,82,102,.22);}
.fam-top .pill{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:900;
  letter-spacing:.08em; background:rgba(255,255,255,.92); border-radius:999px; padding:2px 10px; margin-bottom:5px;}
.fam-top .nm{font-size:16.5px; font-weight:900; line-height:1.45; color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.15);}
.fam-story{font-size:12.5px; font-weight:700; line-height:1.9; color:#54677A;
  background:#F7FBFD; border-radius:14px; padding:12px 14px;}
.fam-asa{font-size:11.5px; font-weight:700; color:#7C8B99; margin-top:9px; line-height:1.75;}
.fam-asa b{color:#C98A3C;}
.fam-stats{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:13px;}
.fs{background:#F7FBFD; border-radius:13px; padding:8px 12px;}
.fs .k{font-size:10.5px; font-weight:900; color:var(--sub);}
.fs .v{font-size:15.5px; font-weight:900;}
.fs .v small{font-size:11px; font-weight:700; color:var(--sub);}
.fs.wide{grid-column:1/-1; background:#FFF6E2;}
.fs.wide .v{font-size:19px; color:var(--money);}
.fam-perk{margin-top:11px; background:linear-gradient(100deg,#FFF0F6,#F3F0FF); border-radius:14px;
  padding:11px 14px;}
.fam-perk .k{font-size:10.5px; font-weight:900; color:#A9629B; letter-spacing:.08em;
  display:flex; align-items:center; gap:5px;}
.fam-perk .v{font-size:13px; font-weight:900; line-height:1.6; color:#5B4A6B;}
.fam-perk .v small{display:block; font-weight:700; font-size:11.5px; margin-top:2px;}
.fam-hid{margin-top:9px; font-size:11.5px; font-weight:900; color:#B0801F; background:#FFF8E4;
  border-radius:12px; padding:8px 12px; display:flex; align-items:flex-start; gap:6px; line-height:1.75;}
.fam-hid .ic{margin-top:3px;}
/* 自分がえらんできたこと（本人のカードの中だけ） */
.fam-mine{margin-top:11px; background:#F1F8F4; border-radius:14px; padding:11px 13px;}
.fam-mine .k{font-size:10.5px; font-weight:900; color:#3E7D5F; letter-spacing:.06em;
  display:flex; align-items:center; gap:5px; margin-bottom:8px;}
.mc-list{display:flex; flex-direction:column; gap:6px;}
.mc-row{display:flex; gap:9px; align-items:flex-start; background:#fff; border-radius:11px; padding:7px 10px;}
.mc-age{flex:none; width:40px; font-size:10.5px; font-weight:900; color:var(--sub); padding-top:2px;}
.mc-main{min-width:0; display:flex; flex-direction:column;}
.mc-door{font-size:10.5px; font-weight:900; color:var(--sub);}
.mc-t{font-size:12.5px; font-weight:900; line-height:1.55;}
.mc-fx{display:flex; gap:9px; font-size:11px; font-weight:900; margin-top:3px;}
.mc-note{font-size:10.5px; font-weight:700; color:#7D9A8A; line-height:1.7; margin-top:9px;}
.m-note.talk{background:#F1F8F4; color:#37604C;}
.m-note.talk small{display:inline-block; margin-top:2px; font-size:11px; font-weight:700; color:#6F8E7E;}
.fam-secret{margin-top:11px; font-size:11px; font-weight:700; color:var(--sub); text-align:center;
  display:flex; align-items:center; justify-content:center; gap:5px;}

/* ---------- 結果発表 ---------- */
#result{padding:30px 16px 60px;}
.res-inner{max-width:760px; margin:0 auto;}
#result h1{font-size:clamp(25px,6vw,36px); font-weight:900; text-align:center; margin-bottom:6px;
  letter-spacing:.06em;}
.res-sub{text-align:center; font-weight:700; color:var(--sub); margin-bottom:24px; font-size:13.5px;}
.res-card{background:var(--card); border-radius:20px; padding:16px 18px 18px; margin-bottom:14px;
  box-shadow:var(--sh);}
.res-head{display:flex; gap:12px; align-items:center;}
.res-head .av{width:50px; height:50px; border-radius:50%; flex:none; border:3px solid var(--pink);
  background-color:#F7FBFD; background-size:cover; background-position:center 16%;}
.rank{display:inline-block; font-size:12px; font-weight:900; background:var(--gold); color:#7A6320;
  border-radius:999px; padding:2px 12px;}
.r-name{font-size:17px; font-weight:900; margin-top:2px;}
.r-fam{font-size:12px; font-weight:900; display:flex; align-items:center; gap:5px; margin-top:1px;}
.r-stats{display:flex; gap:7px; flex-wrap:wrap; margin-top:10px;}
.r-stats .fx{font-size:12.5px; padding:3px 12px;}
.r-ending{margin-top:10px; background:#FFFBF0; border-radius:14px; padding:11px 14px;
  font-size:12.5px; font-weight:700; line-height:1.9; color:#6B5C3E;}
.r-ending b{color:#B07F28;}
.doorbar{display:flex; height:14px; border-radius:999px; overflow:hidden; margin-top:12px; background:#EDF3F7;}
.seg-open{background:var(--ok);} .seg-lock{background:var(--lock);} .seg-unseen{background:var(--unseen);}
.doorbar-label{font-size:11.5px; font-weight:900; color:var(--sub); margin-top:7px; line-height:1.7;}
.doorbar-label .lo{color:#4CA872;} .doorbar-label .ll{color:#C98A3C;} .doorbar-label .lu{color:#7E6BC4;}
.rv-btn{margin-top:11px; font-size:13px;}
.insight{background:var(--card); border-radius:22px; padding:22px; margin-top:24px; line-height:2;
  font-size:14px; font-weight:700; color:#54677A; box-shadow:var(--sh);}
.insight b{color:#D4547A;}
.res-btns{text-align:center; margin-top:24px;}

/* ネタバラシ・トビラ一覧 */
.rule-page{position:relative; text-align:left; padding:20px;}
.rule-close{position:absolute; top:10px; right:12px; background:transparent; font-size:19px;
  font-weight:900; color:var(--sub); padding:4px 8px;}
.rule-list{display:flex; flex-direction:column; gap:10px;}
.rule-item{display:flex; gap:12px; align-items:flex-start; background:#F7FBFD; border-radius:15px;
  padding:12px 14px; font-size:13.5px; line-height:1.85; font-weight:700;}
.rule-item .r-ic{flex:none; color:var(--btn); width:22px; height:22px; margin-top:3px;}
.rule-item .r-ic .ic{width:22px; height:22px;}
.rv-ic .ic{width:20px; height:20px;}
.rule-dots{display:flex; gap:7px; justify-content:center; margin:16px 0 4px;}
.rule-dots span{width:9px; height:9px; border-radius:50%; background:var(--line);}
.rule-dots span.on{background:var(--pink);}
.rule-nav{display:flex; gap:10px; justify-content:center; margin-top:10px;}
.rule-nav .m-btn{margin:0;}
.rv-list{display:flex; flex-direction:column; gap:13px; margin-bottom:14px;}
.rv-door{background:#F7FBFD; border-radius:16px; padding:12px 14px;}
.rv-title{font-weight:900; font-size:14.5px; margin-bottom:8px;}
.rv-opt{display:flex; gap:10px; align-items:flex-start; padding:8px 11px; border-radius:12px;
  text-align:left; background:#fff;}
.rv-opt + .rv-opt{margin-top:6px;}
.rv-opt.chosen{background:#E8F7EE;} .rv-opt.locked{background:#FBF1EA;}
.rv-opt.unseen{background:#F2EEFC;}
.rv-ic{flex:none; width:20px; height:20px; margin-top:2px;}
.rv-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
.rv-t{font-weight:900; font-size:13px;} .rv-d{font-size:11.5px; color:var(--sub); line-height:1.6;}
.rv-meta{font-size:11.5px; font-weight:900; color:#7C8B99;}
.rv-st{flex:none; font-size:10.5px; font-weight:900; color:var(--sub); padding-top:3px;}
.rv-who{display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px; margin-top:5px;
  font-size:11px; font-weight:900;}
.who{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700;
  background:#fff; border-radius:999px; padding:1px 9px; box-shadow:var(--sh-s);}
.who .p-dot{width:10px; height:10px;}
.rv-untrod{font-size:10.5px; font-weight:700; margin-left:8px; background:var(--line);
  border-radius:999px; padding:2px 10px;}

/* 進行役パネル */
#hostOverlay{z-index:120;}
body.host-open #overlay{display:none !important;}
.host-note{background:#F7FBFD; border-radius:14px; padding:11px 14px; font-size:12.5px;
  font-weight:700; line-height:1.8; margin-bottom:14px;}
.host-list{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
.host-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:#F7FBFD;
  border-radius:14px; padding:9px 12px;}
.host-row.off{opacity:.55;}
.host-row .hn{flex:1; min-width:110px; font-weight:900; display:flex; align-items:center; gap:6px;}
.host-row .tag{font-size:11px; font-weight:900; background:#fff; border-radius:999px; padding:2px 9px;}
.host-act{border-radius:999px; background:#fff; font-weight:900; font-size:12px; color:var(--btn);
  padding:6px 13px; box-shadow:var(--sh-s);}
.host-act.danger{color:var(--happy);}
.host-btns{display:flex; flex-direction:column; gap:8px;}
.host-btns .host-act{font-size:14px; padding:11px 14px;}

@media (max-width:640px){
  .topbar .logo{display:none;}
  .card-btn .cb-lbl{display:none;}
  .help-btn.card-btn{width:36px; padding:0;}
  .pcard{flex:1 0 138px; padding:7px 9px;}
  .pcard .av{width:32px; height:32px;}
  #game{padding-bottom:96px;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important;}}
</style>
</head>
<body>

<!-- ========== LOBBY ========== -->
<section id="lobby" class="screen active">
  <div class="setup-card">
    <div class="title-door" aria-hidden="true"><div class="leaf"></div><div class="knob"></div></div>
    <h1 class="game-title">トビラ</h1>
    <p class="game-sub" id="gameSub"></p>
    <div class="row-btns">
      <button class="chip-btn on" id="langJa">日本語</button>
      <button class="chip-btn" id="langEn">English</button>
    </div>
    <div class="player-inputs">
      <div class="p-row"><span class="p-dot" style="background:#F4879F"></span>
        <input id="nameInput" maxlength="12" placeholder="なまえ"></div>
    </div>
    <button class="big-btn" id="createBtn">ルームをつくる</button>
    <p class="setup-note" id="joinNote"></p>
    <div class="player-inputs">
      <div class="p-row"><span class="p-dot" style="background:#FBD96B"></span>
        <input id="codeInput" maxlength="6" placeholder="ABC123" style="text-transform:uppercase; letter-spacing:.2em"></div>
    </div>
    <button class="chip-btn" id="joinBtn">ルームに参加</button>
    <p class="setup-note" id="lobbyNote"></p>
    <p class="setup-note" id="connMsg" style="color:#D9737B"></p>
  </div>
</section>

<!-- ========== WAITING ========== -->
<section id="wait" class="screen">
  <div class="setup-card">
    <h1 class="game-title" style="font-size:clamp(24px,7vw,36px)" id="waitTitle"></h1>
    <p class="game-sub" id="codeLabel"></p>
    <div class="room-code" id="roomCode">------</div>
    <p class="setup-note" id="shareNote"></p>
    <div id="waitList" class="player-inputs"></div>
    <label class="fac-toggle" id="heavyWrap">
      <input type="checkbox" id="heavyToggle">
      <span id="heavyLabel"></span>
    </label>
    <button class="big-btn" id="startBtn"></button>
    <p class="setup-note" id="waitNote"></p>
    <div id="claimWrap" style="display:none; margin-top:10px">
      <button class="chip-btn" id="claimBtn"></button>
    </div>
  </div>
</section>

<!-- ========== GAME ========== -->
<section id="game" class="screen">
  <div class="sticky-head">
    <div class="topbar">
      <div class="logo" id="logoTxt">トビラ</div>
      <div class="turn-pill" id="turnPill"></div>
      <button class="help-btn" id="hostBtn" aria-label="host tools" style="display:none"><svg class="ic"><use href="#ic-tools"/></svg></button>
      <button class="help-btn" id="helpBtnGame" aria-label="how to play"><svg class="ic"><use href="#ic-help"/></svg></button>
      <button class="help-btn card-btn" id="cardBtn" aria-label="my family card"><svg class="ic"><use href="#ic-card"/></svg><span class="cb-lbl" id="cardBtnLabel">カード</span></button>
    </div>
    <div class="players-strip" id="playersStrip"></div>
  </div>
  <div class="board-wrap"><svg id="board" viewBox="0 0 1160 800"></svg></div>
  <div class="controls">
    <button class="dice-btn" id="diceBtn">
      <span class="dice-face" id="diceFace"></span>
      <span id="diceLabel"></span>
    </button>
  </div>
</section>

<!-- ========== RESULT ========== -->
<section id="result" class="screen">
  <div class="res-inner">
    <h1 id="resTitle"></h1>
    <p class="res-sub" id="resSub"></p>
    <p class="setup-note" id="resLeftNote" style="margin-bottom:8px"></p>
    <div id="resultList"></div>
    <div style="text-align:center; margin-bottom:10px">
      <button class="chip-btn" id="allDoorsBtn"></button>
    </div>
    <div class="insight" id="insightBox"></div>
    <div class="res-btns"><button class="big-btn" id="againBtn"></button></div>
  </div>
</section>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBox" role="dialog" aria-modal="true"></div>
</div>
<div class="overlay" id="hostOverlay">
  <div class="modal wide" id="hostBox" role="dialog" aria-modal="true"></div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
