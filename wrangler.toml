name = "tobira-short"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 静的ファイル(ゲーム画面)と WebSocket の両方を同じURLで配信する
[assets]
directory = "./public"
binding = "ASSETS"

# 1ルーム = 1 Durable Object。ゲームの状態はここが持つ
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# 無料枠で使えるのは SQLite バックエンドの Durable Object だけ
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
